<form method="post" action="{% url 'ventes:retour_traiter' r.pk %}" class="d-flex flex-wrap gap-2 align-items-center mt-1">{% csrf_token %}
  <input type="hidden" name="suivant" value="{{ suivant }}">
  <div class="form-check mb-0"><input class="form-check-input" type="checkbox" name="remise_en_stock" value="1" id="rs{{ r.pk }}"><label class="form-check-label" for="rs{{ r.pk }}">Remettre en stock</label></div>
  <button class="btn btn-sm btn-primary" name="decision" value="valider" onclick="return confirm('Valider ce retour et rembourser le client ?')">Valider</button>
  <button class="btn btn-sm btn-outline-danger" name="decision" value="refuser">Refuser</button>
</form>
